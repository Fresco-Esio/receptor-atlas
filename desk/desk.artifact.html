   "nmda": {
    "abstract": "The coincidence detector that underlies memory formation and synaptic plasticity. This glutamate-gated channel opens only when the cell is already depolarised (a molecular AND gate), making it the gateway of long-term potentiation. Loss of its function produces dissociation, fragmented perception, and thought disorganisation that can closely mimic psychosis.",
    "presentation": "Sharp cognition and continuous experience in health; rapid shifts in mood; under loss of function, dissociation, fragmented perception, and disorganized thought.",
    "effect": "Excitatory: calcium-permeable coincidence detector",
    "receptor_class": "Ligand-gated cation channel (ionotropic glutamate)",
    "ligand": "Glutamate (with glycine co-agonist)",
    "figure_caption": "Fig. 14 · A tetrameric coincidence detector",
    "body_json": "[\"NMDA is a voltage- and ligand-gated channel that opens only when glutamate is bound and the membrane is simultaneously depolarised, expelling its magnesium plug; this coincidence-detection property makes it the molecular substrate of Hebbian plasticity and long-term potentiation. Synaptic remodelling downstream of NMDA activation unfolds over hours to days, which may account for the rapid shifts in mood and perception that accompany forced opening or sustained blockade. When NMDA function is disrupted by autoimmune attack or loss-of-function mutation, the resulting syndrome can closely resemble primary psychosis: perceptual fragmentation, derealization, and disorganised thinking, consistent with the glutamate model of psychosis.\"]",
    "tags_json": "[\"Learning & memory\",\"Coincidence detector\",\"Dissociation & psychosis\"]"
   },
   "ampa": {
    "abstract": "The principal mediator of fast excitatory synaptic transmission. AMPA receptor number at a given synapse is proportional to its strength; insertion and removal of receptors during synaptic plasticity underlie learning and memory. Enhanced AMPA throughput is associated with improved cognition and antidepressant effects.",
    "presentation": "In health, sharp moment-to-moment perception and rapid learning; reduced AMPA activity dulls thought and mood, clouding cognition.",
    "effect": "Fast excitatory: the workhorse of excitation",
    "receptor_class": "Ligand-gated cation channel (ionotropic glutamate)",
    "ligand": "Glutamate",
    "figure_caption": "Fig. 15 · The fast-excitation channel",
    "body_json": "[\"AMPA opens within milliseconds of glutamate binding, depolarising the postsynaptic membrane and allowing NMDA receptors to engage. The number of AMPA receptors at a synapse reflects its functional strength: long-term potentiation involves receptor insertion, long-term depression involves removal, and this trafficking is the physical mechanism of learning and memory. Enhanced AMPA throughput is linked to improved cognitive performance and antidepressant effects, likely through downstream increases in BDNF signalling and synaptic density.\"]",
    "tags_json": "[\"Synaptic strength\",\"Moment-to-moment cognition\",\"Learning & memory\"]"
   },
   "gabaa": {
    "abstract": "The principal fast inhibitory receptor in the brain. As a ligand-gated chloride channel, GABA-A hyperpolarizes neurons and suppresses network excitability, maintaining the seizure threshold and supporting sleep. Reduced tone produces anxiety and insomnia; abrupt withdrawal can trigger tremor and seizures; progressive enhancement leads through sedation to surgical anaesthesia.",
    "presentation": "In health, easy sleep and calm wakefulness; low tone presents as anxiety, agitation, and insomnia; loss of accustomed inhibition causes tremor and seizure.",
    "effect": "Fast inhibitory: opens a chloride channel",
    "receptor_class": "Ligand-gated chloride channel (Cys-loop pentamer)",
    "ligand": "GABA",
    "figure_caption": "Fig. 16 · A GABA-gated chloride pentamer",
    "body_json": "[\"GABA-A opens a chloride channel, driving the membrane potential away from the action potential threshold and reducing neuronal firing probability. Subunit composition determines regional functional specificity: α1-containing receptors predominate in circuits mediating sedation and sleep onset, while α2/α3 receptors are more important for anxiolysis. Insufficient GABA-A activity presents clinically as anxiety, agitation, and insomnia; abrupt loss of tonic inhibition, whether from drug withdrawal or autoimmune attack, can produce tremor and generalised seizures, reflecting the role of sustained inhibitory tone in maintaining the normal seizure threshold.\"]",
    "tags_json": "[\"The brain's calm\",\"Sleep & seizure threshold\",\"Inhibitory brake\"]"
   },
   "gabab": {
    "abstract": "The metabotropic form of GABAergic inhibition: a Gi/o-coupled receptor that opens potassium channels and closes calcium channels, producing a slow, prolonged hyperpolarization that complements the fast gating of GABA-A. It relaxes muscle tone and dampens reward urgency; strong agonism produces heavy sedation and deep sleep.",
    "presentation": "Reduced muscle tension and spasticity; blunted craving and reward drive; strong activation produces profound drowsiness and deep sleep.",

    "receptor_class": "Gi/o-coupled GPCR (metabotropic)",
    "ligand": "GABA",
    "figure_caption": "Fig. 17 · The metabotropic GABA receptor",
    "body_json": "[\"GABA-B opens potassium channels and closes calcium channels, producing a late, prolonged phase of inhibition that unfolds over seconds to minutes rather than the milliseconds of GABA-A gating. This slower time course suits its functions: reducing muscle tone and spasticity through inhibition in spinal circuits, and dampening reward urgency through presynaptic inhibition of dopamine release in limbic areas. As a metabotropic GPCR, baclofen's agonism at this receptor accounts for its clinical utility in spasticity and, increasingly, in reducing craving in alcohol use disorder.\"]",
    "tags_json": "[\"Muscle relaxation\",\"Reward quieting\",\"Slow inhibition\"]"
   },
   "m1": {
    "abstract": "The cholinergic receptor central to memory, attention, and the balance of thought itself. M1 engagement sharpens cognition in cortex and hippocampus; its blockade dims these processes, producing mental fog, memory lapses, and, over time, confusion. M1 activation also appears to quiet psychotic signalling without direct dopamine blockade.",
    "presentation": "Healthy M1 tone brings clear memory, focused attention, and emotional steadiness; its loss slides into mental fog, memory lapses, dry mouth, blurred vision, constipation, and, in vulnerable people, confusion tipping into delirium.",
    "effect": "Excitatory: cognition; source of anticholinergic load",
    "receptor_class": "Gq-coupled GPCR (muscarinic)",
    "ligand": "Acetylcholine",
    "figure_caption": "Fig. 18 · A Gq muscarinic receptor",
    "body_json": "[\"M1 receptors in the prefrontal cortex and hippocampus support working memory, attention, and executive function through Gq-coupled phospholipase C signalling. Blockade, whether from tricyclic antidepressants, first-generation antipsychotics, or antihistamines, produces the anticholinergic syndrome: peripherally, dry mouth, constipation, urinary retention, and dilated pupils; centrally, mental fog, memory lapses, and, at higher load in vulnerable individuals, frank delirium. Cumulative anticholinergic burden over years is associated with accelerated cognitive decline. Selective M1 agonism, conversely, improves memory and attention, and may reduce psychotic symptoms through a mechanism independent of dopamine blockade; this is the rationale for xanomeline-trospium as a novel antipsychotic approach.\"]",
    "tags_json": "[\"Memory & attention\",\"Anticholinergic fog\",\"Cholinergic balance\"]"
   },
   "nachr": {
    "abstract": "The fast acetylcholine channel that drives reinforcement and shapes attention. The α4β2 subtype carries the reward signal on dopamine neurons, making this receptor the substrate of dependence and craving. The α7 subtype supports sensory filtering: the suppression of irrelevant, repetitive stimuli to allow focused attention.",
    "presentation": "Healthy α4β2 tone underlies the capacity for reinforced learning and reward; its engagement produces a strong pull toward repetition, and its loss brings withdrawal: irritability, anxiety, and craving. α7 dysfunction weakens sensory gating, leaving the brain flooded with irrelevant stimuli and the person unable to filter noise.",
    "effect": "Fast excitatory: reward, attention, dependence",
    "receptor_class": "Ligand-gated cation channel (Cys-loop pentamer)",
    "ligand": "Acetylcholine (and nicotine)",
    "figure_caption": "Fig. 19 · A nicotine-gated cation pentamer",
    "body_json": "[\"α4β2 nicotinic receptors on mesolimbic dopamine neurons carry the reinforcing signal underlying reward learning. Chronic activation by nicotine produces upregulation of these receptors; in their absence, withdrawal emerges as irritability, dysphoria, and craving, reflecting the degree to which tonic nicotinic stimulation had been integrated into the reward circuit's baseline. The α7 subtype, expressed on prefrontal and hippocampal neurons, supports sensory gating: the suppression of redundant or irrelevant stimuli that allows attention to focus. Reduced α7 function impairs this filtering and is associated with the cognitive symptoms and P50 gating deficits seen in schizophrenia. Partial agonism at α4β2 (varenicline) reduces craving and blunts the reward response to smoking without producing the full reinforcing effect.\"]",
    "tags_json": "[\"Reinforcement & craving\",\"Sensory gating\",\"Fast acetylcholine\"]"
   },
   "h1": {
    "abstract": "The brain's wakefulness dial. Central histamine sustains arousal and alertness throughout the day; it also helps restrain appetite. Blocking H1 brings heavy sedation; over time it drives weight gain through appetite disinhibition and reduced activity.",
    "presentation": "Active H1 signalling keeps a person awake, alert, and appetite-suppressed; blockade produces sedation within hours and, over weeks, progressive appetite increase and weight gain.",

    "ligand": "Histamine",
    "figure_caption": "Fig. 20 · Gq coupling, central wakefulness",
    "body_json": "[\"Histamine neurons in the tuberomammillary nucleus fire steadily throughout waking hours, sustaining cortical and thalamic arousal through H1 receptors. The same signalling restrains appetite through hypothalamic circuits. Blockade produces sedation within hours and, with sustained antagonism as occurs with many antipsychotics and antidepressants, progressive weight gain, driven by appetite disinhibition together with sedation-related inactivity and metabolic effects. The sedating properties are occasionally exploited therapeutically: mirtazapine and low-dose quetiapine are used partly for their H1 antagonism, where the same mechanism that is a side effect in one context is the intended effect in another.\"]",

   "mor": {
    "abstract": "The primary opioid receptor mediating analgesia, euphoria, and reward. Activation reduces pain signalling, produces sedation and emotional well-being, and engages the mesolimbic reward circuit. Repeated activation leads to tolerance and physical dependence; withdrawal produces dysphoria, autonomic hyperactivity, and craving. At supratherapeutic doses, respiratory depression is the critical risk.",
    "presentation": "μ-opioid engagement brings pain relief, warmth, emotional soothing, and pleasure; at higher doses, drowsiness, pinpoint pupils, and slowed breathing. Chronic engagement breeds tolerance and craving; withdrawal brings dysphoria, body aches, and sweating. Blunted baseline tone underlies some forms of anhedonia.",
    "effect": "Inhibitory: analgesia, euphoria, dependence",
    "receptor_class": "Gi/o-coupled GPCR (opioid)",
    "ligand": "β-endorphin, enkephalins",
    "figure_caption": "Fig. 21 · A Gi opioid receptor",
    "body_json": "[\"Endogenous opioid peptides (endorphins and enkephalins) act at μ receptors distributed throughout the central and peripheral nervous system to modulate pain, reward, and autonomic function. Activation produces analgesia, sedation, and well-being, through both direct inhibitory effects in pain pathways and disinhibition of mesolimbic dopamine neurons, where μ receptors silence GABAergic interneurons in the ventral tegmental area to release dopamine in the nucleus accumbens. At higher doses, μ-opioid agonism suppresses respiratory drive in the brainstem, making respiratory depression the primary risk of overdose. Repeated activation triggers receptor desensitization and downregulation: larger doses are required for equivalent analgesia (tolerance), and in the absence of expected agonism, withdrawal emerges, characterized by dysphoria, autonomic hyperactivity, and craving. Endogenous μ-opioid tone also contributes to baseline hedonic capacity; reduced signalling has been proposed as a mechanism in certain presentations of anhedonia, and partial agonism strategies are under investigation as adjunctive treatments in refractory depression.\"]",
    "tags_json": "[\"Relief & euphoria\",\"Dependence & withdrawal\",\"Pain & reward\"]"
   },
   "mt": {
    "abstract": "The receptors that translate darkness into sleep and synchronize the body to the day-night cycle. MT1 primarily eases sleep onset and MT2 primarily shifts the circadian clock, though both are co-expressed in the suprachiasmatic nucleus and contribute to each. Together they read the melatonin signal from the pineal gland and tell the brain when night has arrived.",
    "presentation": "MT1 and MT2 signalling communicates darkness to the suprachiasmatic nucleus, triggering the shift toward sleep onset and aligning the internal clock to the external day-night cycle. MT1 activation promotes sleep onset; MT2 activation shifts circadian phase. The result is phase-aligned sleep rather than generalised sedation.",
    "effect": "Inhibitory: sets circadian phase and sleep onset",
    "receptor_class": "Gi/o-coupled GPCRs (MT1 / MT2)",
    "ligand": "Melatonin",
    "figure_caption": "Fig. 22 · Gi coupling, the circadian clock",
    "body_json": "[\"Melatonin, released from the pineal gland in darkness, circulates to the suprachiasmatic nucleus and binds MT1 and MT2 receptors in the brain's master circadian pacemaker. MT1 activation promotes sleep onset by reducing neuronal firing in wake-promoting circuits; MT2 activation advances or delays circadian phase, adjusting the clock to match the external light-dark cycle. Because the signal acts through endogenous circadian mechanisms rather than generalised sedation, it does not produce the tolerance, dependence, or residual impairment associated with benzodiazepines or z-drugs. Ramelteon (MT1/MT2 agonist) and tasimelteon (for non-24-hour sleep-wake disorder in blind individuals) exploit this mechanism clinically.\"]",
    "tags_json": "[\"Sleep onset\",\"Circadian timing\",\"Darkness signal\"]"
   },
   "ox": {
    "abstract": "The newest sleep target, approached by withdrawing the signal that maintains wakefulness. Orexin neurons stabilize the brain in a continuous awake state; their loss is narcolepsy. Blocking OX1/OX2 reduces wake drive rather than producing generalised sedation, allowing sleep to emerge through normal mechanisms.",
    "presentation": "Healthy orexin tone sustains daytime wakefulness and a stable wake-sleep boundary; its loss is narcolepsy: daytime sleep attacks, fragmented night sleep, and emotion-triggered cataplexy. Blocking the signal reduces wake drive without producing generalised sedation.",
    "effect": "Excitatory: stabilizes wakefulness",
    "receptor_class": "Gq-coupled GPCRs (OX1R / OX2R)",
    "ligand": "Orexin-A / orexin-B (hypocretin)",
    "figure_caption": "Fig. 23 · Gq coupling, the wake switch",
    "body_json": "[\"Orexin neurons in the lateral hypothalamus fire continuously throughout wakefulness, stabilizing arousal and maintaining a sharp wake-sleep boundary through excitatory projections to the locus coeruleus, raphe, and tuberomammillary nucleus. Their loss is narcolepsy with cataplexy: the inability to sustain wakefulness, with sudden loss of muscle tone triggered by strong emotion, reflecting orexin's role in suppressing REM motor atonia during waking hours. Dual orexin receptor antagonists (suvorexant, lemborexant) block both OX1 and OX2, reducing wake drive and facilitating sleep onset without the generalised CNS depression of benzodiazepines or z-drugs. The result is sleep with largely preserved architecture and lower rebound insomnia risk. Orexin replacement strategies, including OX2-selective agonists and intranasal orexin, are under investigation as approaches to narcolepsy that restore the missing arousal signal rather than compensating for it.\"]",
    "tags_json": "[\"Wakefulness switch\",\"Sleep onset\",\"Wake-sleep boundary\"]"
   }

  if (publishing) return;
  flush();
  const changes = store.list();
  if (!countUnpublished(changes)) { toast('Nothing to publish.'); return; }
  if (!token()) { if (!(await openTokenDialog())) return; }
  const btn = $('#pub'); publishing = true; btn.disabled = true; btn.textContent = 'Reading…';
  try {
    const file = await gh('GET', CONTENTS + '?ref=' + GH.branch);
    const repoState = JSON.parse(b64ToUtf8(file.content));
    const prep = preparePublish(SEED, changes, repoState);
    if (!prep.ok) {
      await dialog('pr-h', 'The repo has moved', `<p>The repo's edits file is neither this snapshot's nor what this page already published; it differs in: <b>${esc(prep.diff.join(', '))}</b>. Publishing now would overwrite a change made another way.</p><p class="tiny">Wait for the site to finish rebuilding and reload this page, or (from disk) pull, then run desk:seed and desk:build. Your changes are kept.</p>`, [{ label: 'Close', data: 'cancel', primary: true, value: null }]);
      return;
    }
    btn.textContent = 'Publish';
    const go = await dialog('pc-h', 'Publish to GitHub', `<p>One commit to <b>${esc(GH.owner)}/${esc(GH.repo)}</b> on <b>${esc(GH.branch)}</b>:</p><p class="mono">${esc(prep.subject)}</p><p class="tiny">The site rebuilds by itself afterwards, in a minute or two.</p>`, [{ label: 'Cancel', data: 'cancel', value: false }, { label: 'Publish', data: 'go', primary: true, value: true }]);
    if (!go) return;
    btn.textContent = 'Committing…';
    const res = await gh('PUT', CONTENTS, { message: prep.subject, content: utf8ToB64(prep.text), sha: file.sha, branch: GH.branch });
    const sha = res.commit.sha, at = now();
    for (const pulled of changes) store.put(markPublishedFrom(store.get(pulled.receptorId), pulled, sha, at));
    try { localStorage.setItem(RECEIPT_KEY, JSON.stringify({ sha, at, url: res.commit.html_url || '' })); } catch (e) { /* the banner still shows it this session */ }
    lastReceipt = { sha, at, url: res.commit.html_url || '' };
    renderBanner(); render();
    toast('Published as ' + sha.slice(0, 7) + ' · the site rebuilds in a minute or two.', 6000);
  } catch (e) {
    toast('Publish failed: ' + ((e && e.message) || e), 7000);
    if (e && (e.code === 'auth' || e.code === 'access')) await openTokenDialog();
  } finally { publishing = false; btn.disabled = false; btn.textContent = 'Publish'; }
}
let lastReceipt = readReceipt();
function arrangePublish() {
  const on = !IN_FRAME;
  for (const id of ['#pub', '#ghset']) $(id).classList.toggle('hidden', !on);
  if (!on) return;
  $('#pub').addEventListener('click', publish);
  $('#ghset').addEventListener('click', openTokenDialog);
}
// ---------- re-keying stored documents onto a newer snapshot (browser mode) ----------
// /desk/ is rebuilt on every push, so after a publish the stored documents are keyed to the older snapshot.
// The same rule as desk:rekey: every publish they record must be in the seed's history (GitHub's compare
// answers that, anonymously on a public repo); then published records drop out and the rest carry over.
function renderNotice(text) { const el = $('#notice'); if (!text) { el.classList.add('hidden'); el.textContent = ''; return; } el.textContent = text; el.classList.remove('hidden'); }
// One run at a time: a call while a run is in flight gets a fresh run chained after it, so an Import's documents
// are never missed. Each run re-reads the store after every await, and everything after the last await is
// synchronous, so an edit, a Publish's marks or an Import made while GitHub answered is never overwritten.
let rekeying = null;
function rekeyStale() {
  if (IN_FRAME || store.mode !== 'browser' || SEED.commit === 'uncommitted') return Promise.resolve();
  if (rekeying) return rekeying.then(() => rekeyStale());
  rekeying = rekeyRun().finally(() => { rekeying = null; });
  return rekeying;
}
function rekeyRefusal(nDocs, receptors, n) {
  return `${nDocs} document${nDocs === 1 ? ' is' : 's are'} keyed to an older snapshot and not re-keyed: ${receptors.join(', ')} hold${receptors.length === 1 ? 's' : ''} ${n} unpublished revert${n === 1 ? '' : 's'}/detach${n === 1 ? '' : 'es'}. Publish or undo them, then reload.`;
}
async function rekeyRun() {
  const anc = new Set(), checked = new Set();
  for (;;) {
    flush();
    const stale = store.list().filter(c => c.seedCommit !== SEED.commit);
    if (!stale.length) { renderNotice(''); return; }
    const docs = `${stale.length} document${stale.length === 1 ? ' is' : 's are'} keyed to an older snapshot`;
    // reverts refuse whatever GitHub says, so they are reported without a request
    const rv = unpublishedReverts(stale);
    if (rv.length) { renderNotice(rekeyRefusal(stale.length, rv.map(x => x.receptorId), rv.reduce((a, x) => a + x.n, 0))); return; }
    const todo = publishedShas(stale).filter(sha => !checked.has(sha));
    if (todo.length) {
      try {
        for (const sha of todo) {
          checked.add(sha);
          try { const r = await gh('GET', `/repos/${GH.owner}/${GH.repo}/compare/${encodeURIComponent(sha)}...${encodeURIComponent(SEED.commit)}`); if (r.status === 'ahead' || r.status === 'identical') anc.add(sha); }
          catch (e) { if (e && e.code === 'access') continue; throw e; }   // 404: GitHub does not know that commit, so it is not an ancestor
        }
      } catch (e) {
        const why = e && e.code === 'network' ? e.message : `GitHub could not be reached (${(e && e.message) || e})`;
        renderNotice(`${docs} and could not be re-keyed: ${why}. Editing continues on them.`); return;
      }
      continue;   // the store may have changed while GitHub answered: re-read it before deciding
    }
    // from here to the end nothing awaits, so the documents written are the ones just read
    const r = rekeyAll(SEED, stale, sha => anc.has(sha));
    if (!r.ok) {
      renderNotice(r.reason === 'unpublished reverts'
        ? rekeyRefusal(stale.length, r.receptors, r.n)
        : `${docs} and not re-keyed: a publish they record (${r.missing.map(s => s.slice(0, 7)).join(', ')}) is not in the history of this snapshot (${SEED.commit}). If the site is still rebuilding, reload in a minute; otherwise use Download changes to keep them safe.`);
      return;
    }
    for (const d of r.docs) store.put(d);
    renderNotice(`re-keyed ${r.docs.length} document${r.docs.length === 1 ? '' : 's'} onto seed ${SEED.commit}`);
    if (editingNow()) { deferredRender = true; renderBanner(); } else { flush(); render(); }
    return;
  }
}
// ---------- Import changes (browser mode): a changes.json from the claude.ai copy or another browser ----------
function arrangeImport() {
  $('#imp').classList.toggle('hidden', IN_FRAME);
  if (IN_FRAME) return;
  $('#imp').addEventListener('click', () => $('#impfile').click());
  $('#impfile').addEventListener('change', async () => {
    const file = $('#impfile').files[0]; $('#impfile').value = ''; if (!file) return;
    let docs;
    try { docs = JSON.parse(await file.text()); } catch (e) { toast('That file is not JSON.'); return; }
    if (!Array.isArray(docs)) { toast('Expected an array of change documents, as Download changes saves it.'); return; }
    flush();
    let n = 0, skipped = 0;
    for (const d of docs) {
      if (changeShapeError(d) || !KNOWN.has(d.receptorId)) { skipped++; continue; }
      store.put(mergeChanges(store.all[d.receptorId] || null, d)); n++;
    }
    renderBanner(); render();
    toast(`Imported ${n} document${n === 1 ? '' : 's'}${skipped ? ` (${skipped} skipped)` : ''}.`, 5000);
    await rekeyStale();
  });
}
// ---------- boot ----------
await store.init(); arrangeDownloads(); arrangePublish(); arrangeImport(); renderPicker(); render(); renderMergeLine();
store.subscribe(onRemoteChange);
// The PubMed connector, once; the source form reads `mcp` each time it opens.
try { if (window.claude?.use) mcp = await window.claude.use('mcp'); } catch { mcp = null; }
// expose for the walkthrough (after boot, so its presence means the page is ready)
window.__desk = { SEED, BUILT_AT, store, toCuratorState, markPublished, markPublishedFrom, mergeChanges, preparePublish, publish, rekeyStale, flush, view: () => view(), rekeyDone: false };
await rekeyStale(); window.__desk.rekeyDone = true;
</script>
