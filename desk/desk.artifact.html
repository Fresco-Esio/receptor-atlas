<title>Receptor Atlas Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&display=swap" rel="stylesheet">
<style>
/* ---- Lifted verbatim from Provenance (atlas-ref/provenance.html): :root tokens + base, .hue,
   buttons + fields (.btn/.field/.pill/.chip), write view (.write, #flow, .margin, .mcard, .editor,
   .cite, .tag, .pop), sources view (.srow), modal + toast. ---- */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --paper-2:#F3F4F3; --ink:#000000; --ink-2:#3D444C; --ink-3:#7A828A; --line:#E3E5E7; --line-2:#EEF0F1;
  --ok:#2E7D5B; --bad:#B7472A; --warn:#B9831F; --info:#2F6F8F;
  --ok-soft:#E4F1EA; --bad-soft:#F7E6E0; --warn-soft:#F8EFDB; --info-soft:#E3EDF3;
  --hl:#FFF0A6; --sat:55%; --lum:36%; --bgsat:55%; --bglum:90%; --txtlum:22%;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif; --serif:"Inter","Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--info); text-decoration-thickness:1px; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--ink-2); outline-offset:2px}
h1,h2,h3{margin:0; font-weight:500; line-height:1.25}
h1{font-size:1.25rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0 0 .6rem}
code,.mono{font-family:var(--mono); font-size:.86em}
.hidden{display:none !important}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .tiny{font-size:.78rem; color:var(--ink-3)}
.grow{flex:1}

/* per-source colour: set --h on the element */
.hue{--c:hsl(var(--h) var(--sat) var(--lum)); --cbg:hsl(var(--h) var(--bgsat) var(--bglum)); --ct:hsl(var(--h) 55% var(--txtlum))}

/* buttons + fields */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:7px; border:1px solid var(--line); background:transparent; cursor:pointer; font-size:.88rem; white-space:nowrap; color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.primary:hover{opacity:.9; background:var(--ink)}
.btn.sm{padding:3px 8px; font-size:.8rem}
.btn.ghost{border-color:transparent; color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px}
.field label{font-size:.8rem; color:var(--ink-2)}
.field input,.field textarea,.field select,.in{padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--paper); width:100%}
.field textarea{min-height:64px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr; gap:0 14px}
@media (min-width:700px){ .grid2{grid-template-columns:1fr 1fr} }
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:1px 9px; font-size:.76rem; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap}
.pill.ok{color:var(--ok); border-color:transparent; background:var(--ok-soft)}
.pill.bad{color:var(--bad); border-color:transparent; background:var(--bad-soft)}
.pill.warn{color:var(--warn); border-color:transparent; background:var(--warn-soft)}
.pill.info{color:var(--info); border-color:transparent; background:var(--info-soft)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); background:transparent; font-size:.8rem; cursor:pointer}
.chip.on{background:var(--paper-2); border-color:var(--ink-3)}
.chip.hue{background:var(--cbg); color:var(--ct); border-color:transparent; font-weight:500}
.chip.dash{border-style:dashed; color:var(--ink-2)}
hr{border:0; border-top:1px solid var(--line); margin:16px 0}

/* write view */
.write{position:relative; max-width:720px}
.write .editor{max-width:36em}
@media (min-width:1000px){ .write{max-width:none; display:grid; grid-template-columns:minmax(0,36em) minmax(300px,360px); column-gap:clamp(40px,5vw,96px); align-items:start; font-size:clamp(1.2rem,.85rem + .55vw,1.65rem)} .write .editor{font-size:1em} .write .margin{font-size:15px} }
@media (min-width:1000px){ .main.writing{padding-left:clamp(40px,10vw,260px); padding-right:28px} }
.wline{max-width:none !important}
.wline .srcbtn{text-decoration:none}
.wline .srcbtn.on{color:var(--ink)}
#flow{position:absolute; left:0; top:0; width:100%; pointer-events:none; overflow:visible; z-index:1}
#flow path{fill:none; stroke-width:1.2; opacity:.7}
#flow path.dim{opacity:.12}
#flow path.hi{stroke-width:1.6; opacity:1}
.margin{position:relative; z-index:3; margin-top:34px}
.margin:empty{margin:0}
@media (min-width:1000px){ .margin{margin-top:0} }
.mcard{background:var(--bg); border:1px solid var(--line); border-left:3px solid var(--c,var(--ink-3)); border-radius:8px; padding:10px 12px 11px; margin:0 0 10px; font-size:.84rem; line-height:1.45; transition:opacity .15s; box-shadow:0 2px 14px rgba(0,0,0,.05)}
.mcard .sblock + .sblock{margin-top:12px; padding-top:12px; border-top:1px solid var(--line-2)}
.mcard .shead{display:flex; align-items:center; gap:7px}
.mcard .shead .lab{font-weight:600; color:var(--ct); font-size:.9rem}
.mcard .smeta{color:var(--ink-2); font-size:.76rem; margin-top:2px}
.mcard .ttl{color:var(--ink); margin-top:4px; font-size:.84rem; line-height:1.35}
.mcard .field{margin:8px 0 0} .mcard .field label{font-size:.7rem; color:var(--ink-3)}
.mcard .field textarea{min-height:38px; font-size:.8rem; padding:5px 7px; line-height:1.35}
.mcard .cardfoot{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; padding-top:9px; border-top:1px solid var(--line-2)}
.mcard .cardfoot .l{font-size:.72rem; color:var(--ink-3); flex-basis:100%}
.mcard .x{margin-left:auto; border:0; background:transparent; color:var(--ink-3); cursor:pointer; font-size:1rem; line-height:1; padding:0 2px}
.mcard .x:hover{color:var(--ink)}
.mcard .chips{gap:5px}
.slist .srow2{display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-2); cursor:pointer}
.slist .srow2:hover{background:var(--paper-2)}
.slist .srow2 .lab{font-weight:600; color:var(--ct)}
.slist .srow2 .st{margin-left:auto; font-size:.72rem; color:var(--ink-3); white-space:nowrap}
.slist .srow2 .st.warn{color:var(--warn)}
.slist .srow2.on{background:var(--paper-2)}
.mcard.dim{opacity:.3}
.mcard.open{border-color:var(--ink-3); border-left-color:var(--c)}
.mhead{display:flex; align-items:center; gap:7px; cursor:pointer}
.mhead .lab{font-weight:600; color:var(--ct); font-size:.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mhead .n{margin-left:auto; color:var(--ink-3); font-size:.72rem}
.mtitle{color:var(--ink-2); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.mstatus{margin-top:4px; color:var(--ink-3); font-size:.74rem}
.mstatus.warn{color:var(--warn)}
.mctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px solid var(--line-2); font-size:.76rem}
.mctl select{padding:2px 6px; border:1px solid var(--line); border-radius:6px; background:var(--paper); font-size:.76rem}
.mctl .check{padding:0; gap:5px} .mctl .check input{width:14px; height:14px; margin-top:0}
.mbtns{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.mbtns .btn{padding:2px 7px; font-size:.74rem}
.mrows{margin-top:8px}
.mrow{border-top:1px solid var(--line-2); padding:7px 0 4px; border-left:2px solid var(--line); padding-left:8px; margin-top:6px}
.mrow.supports{border-left-color:var(--ok)} .mrow.conflicting{border-left-color:var(--bad)} .mrow.void{border-left-color:var(--warn)}
.mrow .mclaim{font-size:.82rem; color:var(--ink); line-height:1.35}
.mrow select{padding:1px 5px; border:1px solid var(--line); border-radius:6px; background:var(--paper); font-size:.74rem}
.mrow .tiny{margin-top:3px; line-height:1.35}
.mrow .tiny.warn{color:var(--warn)}
.madd{display:flex; gap:6px; flex-wrap:wrap; border-style:dashed; border-left-style:dashed; border-left-color:var(--line); background:transparent}
.madd .btn{padding:2px 8px; font-size:.76rem}
.wline{display:flex; gap:14px; align-items:baseline; font-size:.74rem; color:var(--ink-3); margin-bottom:30px; max-width:720px}
.wline button{border:0; background:transparent; color:var(--ink-3); cursor:pointer; padding:0; font-size:inherit; text-decoration:underline; text-underline-offset:3px}
.wline button:hover{color:var(--ink)}
.gutter{display:none}
.gdot{width:12px; height:12px; border-radius:50%; background:var(--c); border:0; padding:0; cursor:pointer; position:relative; opacity:.9}
.gdot.hollow{background:transparent; border:2px solid var(--c)}
.gdot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.gdot::after{content:attr(data-label); position:absolute; left:18px; top:-5px; font-family:var(--sans); font-size:.72rem; font-weight:500; color:var(--ct); background:var(--cbg); padding:1px 7px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s}
.gdot:hover::after,.gdot:focus-visible::after,.gdot.on::after{opacity:1}
.editor{font-family:var(--sans); font-size:clamp(1.2rem,.85rem + .55vw,1.65rem); line-height:1.62; font-weight:400; letter-spacing:-.005em; min-height:60vh; outline:0; padding:2px 0; caret-color:var(--ink); color:var(--ink); -webkit-font-smoothing:antialiased}
.editor p{margin:0 0 1.15em}
.editor[data-empty="1"]::before{content:attr(data-ph); color:var(--ink-3); font-style:italic; position:absolute; pointer-events:none}
.cite{position:relative; color:inherit}
.cite::before,.cite::after{color:var(--c); font-family:var(--sans); font-weight:600; font-size:.95em; line-height:0; vertical-align:-.05em}
.cite::before{content:"\231C"; margin-right:1px}
.cite::after{content:"\231D"; margin-left:1px}
.cite.pending{background:var(--hl); --c:var(--ink-3)}
.cite.pending::before,.cite.pending::after{color:var(--ink-3)}
.cite.weak::before,.cite.weak::after{opacity:.6}
.cite{cursor:pointer; border-radius:3px; transition:background .12s}
.cite:hover{background:hsl(var(--h,0) 40% 96%)}
.cite.pending:hover{background:var(--hl)}
.cite.active{background:var(--cbg)}
.cite.pending.active{background:var(--hl); outline:1px dashed var(--ink-3)}
.cite.dim{opacity:.35}
.tag{display:inline-block; font-family:var(--sans); font-size:.5em; font-weight:600; line-height:1.4; padding:0 .5em; border-radius:.3em; background:var(--cbg); color:var(--ct); vertical-align:.5em; margin:0 .2em; user-select:none; -webkit-user-select:none; cursor:pointer; white-space:nowrap}
.tag.pending{background:transparent; color:var(--ink-3); border:1px dashed var(--ink-3)}
.tag.dim{opacity:.35}
.pop{position:absolute; z-index:30; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:8px 10px; box-shadow:0 6px 24px rgba(0,0,0,.12); font-family:var(--sans); font-size:.84rem; max-width:min(92vw,460px)}
.pop .l{font-size:.74rem; color:var(--ink-3); margin-bottom:6px}
.pop .chips{gap:5px}
.pop .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px solid var(--line-2)}

/* sources view */
.srow{border-bottom:1px solid var(--line); padding:12px 2px}
.srow .top1{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center}
.srow .lab{font-weight:500; color:var(--ct); border:0; background:transparent; padding:0 2px; font-size:.95rem; min-width:40px; max-width:100%}
.srow .lab:focus{outline:0; border-bottom:1px dashed var(--ink-3)}
.srow .lab-wrap{display:flex; align-items:center; gap:6px; min-width:0}
.srow .pen{color:var(--ink-3); font-size:.75rem; opacity:0; transition:opacity .15s}
.srow .lab-wrap:hover .pen,.srow .lab:focus + .pen{opacity:1}
.srow .ttl{font-family:var(--serif); font-size:1.02rem; line-height:1.35; margin:2px 0 2px}
.srow .meta{font-size:.8rem; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap}
.srow .status{display:flex; gap:8px; align-items:center; font-size:.78rem; color:var(--ink-3); white-space:nowrap}
.srow select.q{border:0; background:transparent; color:var(--ink-2); font-size:.78rem; padding:0}
.srow .more{display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--line-2)}
.srow.open .more{display:block}
.srow .ctl{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px}
@media (min-width:720px){ .srow .ctl{grid-template-columns:repeat(4,1fr)} }
.srow .ctl select,.srow .ctl input{width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:7px; background:var(--paper); font-size:.86rem}

/* modal + toast */
.modal-bg{position:fixed; inset:0; background:rgba(10,12,14,.42); z-index:50; display:flex; align-items:flex-end; justify-content:center}
@media (min-width:720px){ .modal-bg{align-items:center} }
.modal{background:var(--paper); width:100%; max-width:700px; max-height:92vh; overflow:auto; border-radius:14px 14px 0 0; padding:18px; border:1px solid var(--line)}
@media (min-width:720px){ .modal{border-radius:14px} }
.modal h2{margin-bottom:10px}
.modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(64px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:9px; font-size:.84rem; z-index:60; max-width:92vw}
@media (min-width:760px){ .toast{bottom:24px} }
@media (prefers-reduced-motion:no-preference){ .modal{animation:up .18s ease-out} @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}} }

:root{ color-scheme: light only; }

<script type="module">
// The Desk's logic with nothing attached to it: no DOM, no node: imports, so the same
// file runs in the page and in scripts/desk-pull.mjs. Everything here is a pure function
// over plain objects; the page and the scripts own the side effects.
const FORMAT = 1;
const ARCHIVE_SCALAR = ['abstract', 'presentation', 'effect', 'receptor_class', 'ligand', 'figure_caption'];
const ARCHIVE_LIST = { body: 'body_json', tags: 'tags_json' };
const ARCHIVE_COLS = ['abstract', 'presentation', 'effect', 'receptor_class', 'ligand', 'figure_caption', 'body_json', 'tags_json'];
const CLINICAL_SCALAR = ['sys', 'name', 'cls', 'baseline', 'mech', 'stahl', 'onset', 'time_course'];
const CLINICAL_LIST = { over: 'over_json', under: 'under_json', agonists: 'agonists_json', antagonists: 'antagonists_json', risk_factors: 'risk_factors_json', monitoring: 'monitoring_json' };
const CLINICAL_COLS = ['sys', 'name', 'cls', 'baseline', 'mech', 'over_json', 'under_json', 'stahl', 'agonists_json', 'antagonists_json', 'onset', 'time_course', 'risk_factors_json', 'monitoring_json'];
const SOURCE_COLS = ['kind', 'authors', 'year', 'title', 'journal', 'pmid', 'doi', 'url', 'notes'];
const REVIEW_COLS = ['mechanism', 'affinity', 'clinical', 'citation', 'mastery', 'note'];
const REVIEW_MARKS = ['mechanism', 'affinity', 'clinical'];
const VOLUMES = ['archive', 'cabinet', 'ledger'];

const clone = o => JSON.parse(JSON.stringify(o));

/** The last published state behind a record: the record itself when it is published (without any
 *  predecessor of its own), else the predecessor it already carries, else null. A record that overwrites a
 *  published one keeps this under `published`, so publishedOnly can still say what the repo file holds. */
function predecessorOf(rec) {
  if (!rec) return null;
  if (rec.publishedAs) { const { published: _p, ...own } = rec; return clone(own); }
  return rec.published ? clone(rec.published) : null;
}
const withPredecessor = (rec, pred) => { if (pred) rec.published = pred; else delete rec.published; return rec; };

/** Same rule as scripts/curator-state.mjs sourceKey(): identify a paper by what identifies it in the world. */
function sourceKey(s) {
  if (s.pmid) return `pmid:${String(s.pmid).trim()}`;
  if (s.doi) return `doi:${String(s.doi).trim().toLowerCase()}`;
  if (s.url) return `url:${String(s.url).trim()}`;
  return `cite:${[s.kind, s.authors, s.year, s.title].map(v => String(v ?? '').trim()).join('|')}`;
}

function emptyChanges(receptorId, seedCommit) {
  return { receptorId, seedCommit, fields: {}, sources: { add: [], remove: [], set: {} }, library: {}, spans: [], review: null };
}

function setField(changes, path, value, at) {
  if (path !== 'claim' && !path.startsWith('archive.') && !path.startsWith('clinical.')) throw new Error('unknown field path: ' + path);
  const c = clone(changes);
  c.fields[path] = withPredecessor({ value: Array.isArray(value) ? [...value] : value, at, publishedAs: null }, predecessorOf(c.fields[path]));
  return c;
}

/** "Back to the seed value" for one field, and drop any spans on it. A record with no published state
 *  behind it is simply deleted; otherwise it becomes a tombstone { cleared: true, at, publishedAs: null,
 *  published }, because the repo's edits file carries the published value and the next publish has to
 *  take it back out. */
function clearField(changes, path, at = null) {
  const c = clone(changes);
  const pred = predecessorOf(c.fields[path]);
  if (pred) c.fields[path] = { cleared: true, at, publishedAs: null, published: pred };
  else delete c.fields[path];
  c.spans = (c.spans || []).filter(sp => !(sp.field === path || (typeof sp.field === 'string' && sp.field.startsWith(path + '.'))));
  return c;
}

const seededSource = (seedReceptor, key) => (seedReceptor.sources || []).some(s => s.key === key);
const seedReceptorOf = (seed, id) => seed.receptors.find(r => r.id === id);
/** Was this key explicitly passed? Distinguishes "clear it to null" from "leave it alone" —
 *  `??` treats an explicit null the same as absent, which silently un-does a cleared flag. */
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/** meta: SOURCE_COLS object for a new paper (the library row). flags: { is_primary, conflicting, correction_note }. */
function attachSource(changes, seed, meta, flags, at) {
  const c = clone(changes); const key = sourceKey(meta);
  const r = seedReceptorOf(seed, c.receptorId);
  if (seededSource(r, key) || c.sources.add.some(s => s.key === key)) throw new Error('already attached');
  // attached again after a detach: the remove goes, and whatever was published behind it stays behind the add
  const removed = (c.sources.remove || []).find(x => x.key === key);
  c.sources.remove = (c.sources.remove || []).filter(x => x.key !== key);
  if (!seed.sources[key]) c.library[key] = Object.fromEntries(SOURCE_COLS.map(k => [k, meta[k] ?? null]));
  c.sources.add.push(withPredecessor({ key, is_primary: flags.is_primary ? 1 : 0, conflicting: !!flags.conflicting, correction_note: flags.correction_note ?? null, at, publishedAs: null }, predecessorOf(removed)));
  return c;
}

function detachSource(changes, seed, key, at) {
  const c = clone(changes);
  const i = c.sources.add.findIndex(s => s.key === key);
  if (i < 0) {
    const r = seedReceptorOf(seed, c.receptorId);
    if (r && seededSource(r, key)) throw new Error('seeded source: flag it as conflicting instead');
    throw new Error('unknown source: ' + key);
  }
  const [gone] = c.sources.add.splice(i, 1); delete c.sources.set[key];
  // An add with a published state behind it is in the repo's edits file: record the detach (with that state,
  // and its library row, which the converter drops once nothing cites it) so the next publish takes it out.
  const pred = predecessorOf(gone);
  if (pred) (c.sources.remove = c.sources.remove || []).push({ key, at, publishedAs: null, published: pred });
  else delete c.library[key];
  c.spans = c.spans.filter(sp => sp.sourceKey !== key);
  return c;
}

/** A flag counts as "set by the caller" only when it isn't undefined — `{ is_primary: undefined }`
 *  leaves the stored value alone, while an explicit `null` (correction_note) still clears it. */
const given = (flags, k) => flags[k] !== undefined;

function setSourceFlags(changes, seed, key, flags, at) {
  const c = clone(changes);
  const added = c.sources.add.find(s => s.key === key);
  if (added) { const pred = predecessorOf(added); withPredecessor(Object.assign(added, { is_primary: given(flags, 'is_primary') ? flags.is_primary : added.is_primary, conflicting: given(flags, 'conflicting') ? flags.conflicting : added.conflicting, correction_note: given(flags, 'correction_note') ? flags.correction_note : added.correction_note, at, publishedAs: null }), pred); return c; }
  const r = seedReceptorOf(seed, c.receptorId);
  const seeded = (r.sources || []).find(s => s.key === key);
  if (!seeded) throw new Error('unknown source');
  // conflicting stays undefined until the caller gives it: an untouched flag keeps the seed's own status (see edgeStatus)
  const cur = c.sources.set[key];   // a cleared set record (a re-created revert) is the seed's own flags
  const prev = cur && !cur.cleared ? cur : { is_primary: seeded.is_primary, conflicting: undefined, correction_note: seeded.correction_note };
  const pred = predecessorOf(c.sources.set[key]);
  c.sources.set[key] = withPredecessor({ is_primary: given(flags, 'is_primary') ? flags.is_primary : prev.is_primary, conflicting: given(flags, 'conflicting') ? flags.conflicting : prev.conflicting, correction_note: given(flags, 'correction_note') ? flags.correction_note : prev.correction_note, at, publishedAs: null }, pred);
  return c;
}

/** The status of a SEEDED edge under a sources.set record: conflicting given true → 'conflicting'; given false
 *  on an edge the seed has as 'conflicting' → 'verified' (clearing a conflict asserts the source agrees);
 *  never given (undefined), or false on any other edge → the seed's own status ('provided' stays 'provided'). */
function edgeStatus(seedStatus, set) {
  if (!set || set.conflicting === undefined || set.conflicting === null) return seedStatus;
  if (set.conflicting) return 'conflicting';
  return seedStatus === 'conflicting' ? 'verified' : seedStatus;
}

/** Stores only the keys the caller passed (plus at/publishedAs), merged over any previously
 *  stored partial — a partial update must not erase marks or the note set earlier. */
function setReview(changes, marks, at) {
  const c = clone(changes);
  const pred = predecessorOf(c.review);
  const { cleared: _c, published: _p, ...before } = c.review && !c.review.cleared ? c.review : {};
  c.review = withPredecessor({ ...before, ...marks, at, publishedAs: null }, pred);
  return c;
}

/** The receptor as the page should show it: seed with every change laid over it. */
function viewOf(seedReceptor, changes) {
  const v = clone(seedReceptor);
  for (const [path, f] of Object.entries(changes.fields)) {
    if (f.cleared) continue;   // a tombstone: the seed value shows
    const val = Array.isArray(f.value) ? [...f.value] : f.value;
    if (path === 'claim') v.claim = val;
    else { const [vol, field] = path.split('.'); if (!v[vol]) v[vol] = {}; v[vol][field] = val; }
  }
  const removed = new Set(((changes.sources || {}).remove || []).map(x => x.key));
  const sources = (v.sources || []).filter(s => !removed.has(s.key)).map(s => {
    const set = changes.sources.set[s.key];
    return set && !set.cleared ? { ...s, is_primary: set.is_primary, status: edgeStatus(s.status, set), correction_note: set.correction_note } : s;
  });
  for (const a of changes.sources.add) sources.push({ key: a.key, is_primary: a.is_primary, status: a.conflicting ? 'conflicting' : 'verified', correction_note: a.correction_note, added: true });
  v.sources = sources;
  if (changes.review && !changes.review.cleared) {
    const base = v.review || { mechanism: 0, affinity: 0, clinical: 0, citation: 0, mastery: 0, note: '' };
    v.review = {
      ...base,
      mechanism: has(changes.review, 'mechanism') ? changes.review.mechanism : base.mechanism,
      affinity: has(changes.review, 'affinity') ? changes.review.affinity : base.affinity,
      clinical: has(changes.review, 'clinical') ? changes.review.clinical : base.clinical,
      note: has(changes.review, 'note') ? changes.review.note : base.note,
    };
  }
  return v;
}

const eq = (a, b) => (a ?? null) === (b ?? null);
/** A list column: the router writes '[]' for an empty list, and a pristine null is also "no items". */
const eqList = (raw, pristine) => eq(raw, pristine) || (raw === '[]' && pristine == null);
const pickOrdered = (obj, cols) => Object.fromEntries(cols.filter(k => k in obj).map(k => [k, obj[k]]));

/** changes (one per receptor) → a format-1 edits file, a delta from the pristine seed. */
function toCuratorState(seed, changesList) {
  const out = clone(seed.baseState);
  out.content = out.content || { claims: {}, archive: {}, clinical: {}, bindings: [] };
  const P = seed.pristine;
  const upsertEdge = (edge) => { const i = out.receptorSources.findIndex(e => e.receptor_id === edge.receptor_id && e.source === edge.source); if (i < 0) out.receptorSources.push(edge); else out.receptorSources[i] = edge; };
  const dropEdge = (id, key) => { out.receptorSources = out.receptorSources.filter(e => !(e.receptor_id === id && e.source === key)); };
  const upsertSource = (key, meta) => { const row = { key, ...pickOrdered(meta, SOURCE_COLS) }; const i = out.sources.findIndex(s => s.key === key); if (i < 0) out.sources.push(row); else out.sources[i] = row; };
  const dropSource = key => { out.sources = out.sources.filter(s => s.key !== key); };
  const stamp = (id, vol, edited, reviewed) => {
    let a = out.activity.find(x => x.receptor_id === id && x.volume === vol);
    if (!a) { a = { receptor_id: id, volume: vol, last_edited_at: null, last_reviewed_at: null }; out.activity.push(a); }
    if (edited && (!a.last_edited_at || edited > a.last_edited_at)) a.last_edited_at = edited;
    if (reviewed && (!a.last_reviewed_at || reviewed > a.last_reviewed_at)) a.last_reviewed_at = reviewed;
  };

  const removedKeys = new Set();
  for (const c of changesList) {
    const id = c.receptorId; const r = seedReceptorOf(seed, id);
    if (!r) throw new Error('unknown receptor: ' + id);
    const no = r.clinicalNo;
    // --- content fields ---
    const arch = { ...(out.content.archive[id] || {}) }, clin = { ...(no != null ? out.content.clinical[no] || {} : {}) };
    for (const [path, f] of Object.entries(c.fields)) {
      // A tombstone is "back to the seed": out started as a copy of the seed's own edits file, so the
      // column is left as the seed has it; only the activity records that something was reverted.
      if (f.cleared) { stamp(id, path === 'claim' ? 'cabinet' : path.startsWith('archive.') ? 'archive' : 'ledger', f.at); continue; }
      if (path === 'claim') { if (eq(f.value, P.claims[id])) delete out.content.claims[id]; else out.content.claims[id] = f.value; stamp(id, 'cabinet', f.at); continue; }
      const [vol, field] = path.split('.');
      if (vol === 'archive') {
        const col = ARCHIVE_LIST[field] || field; const raw = ARCHIVE_LIST[field] ? JSON.stringify(f.value ?? []) : f.value;
        if ((ARCHIVE_LIST[field] ? eqList : eq)(raw, (P.archive[id] || {})[col])) delete arch[col]; else arch[col] = raw;
        stamp(id, 'archive', f.at);
      } else {
        if (no == null) throw new Error('receptor has no Ledger row: ' + id);
        const col = CLINICAL_LIST[field] || field; const raw = CLINICAL_LIST[field] ? JSON.stringify(f.value ?? []) : f.value;
        if ((CLINICAL_LIST[field] ? eqList : eq)(raw, (P.clinical[no] || {})[col])) delete clin[col]; else clin[col] = raw;
        stamp(id, 'ledger', f.at);
      }
    }
    if (Object.keys(arch).length) out.content.archive[id] = pickOrdered(arch, ARCHIVE_COLS); else delete out.content.archive[id];
    if (no != null) { if (Object.keys(clin).length) out.content.clinical[no] = pickOrdered(clin, CLINICAL_COLS); else delete out.content.clinical[no]; }
    // --- sources ---
    for (const [key, meta] of Object.entries(c.library)) { const pr = P.sources[key]; if (pr && SOURCE_COLS.every(k => eq(meta[k], pr[k]))) dropSource(key); else upsertSource(key, meta); }
    for (const a of c.sources.add) { upsertEdge({ receptor_id: id, source: a.key, status: a.conflicting ? 'conflicting' : 'verified', is_primary: a.is_primary ? 1 : 0, correction_note: a.correction_note ?? null }); stamp(id, 'archive', a.at); }
    for (const x of c.sources.remove || []) { dropEdge(id, x.key); removedKeys.add(x.key); stamp(id, 'archive', x.at); }
    for (const [key, s] of Object.entries(c.sources.set)) {
      if (s.cleared) { stamp(id, 'archive', s.at); continue; }   // back to the seed's edge: out already has it
      const pr = P.receptorSources[`${id}|${key}`];
      const seeded = (r.sources || []).find(x => x.key === key);
      const edge = { receptor_id: id, source: key, status: edgeStatus(seeded ? seeded.status : (pr ? pr.status : 'verified'), s), is_primary: s.is_primary ? 1 : 0, correction_note: s.correction_note ?? null };
      if (pr && pr.status === edge.status && (pr.is_primary ? 1 : 0) === edge.is_primary && eq(pr.correction_note, edge.correction_note)) dropEdge(id, key); else upsertEdge(edge);
      stamp(id, 'archive', s.at);
    }
    // --- review: only the keys the caller actually set override the base; citation/mastery
    // are Desk-only fields with no setter here, so they always come from the base. ---
    if (c.review && c.review.cleared) { for (const vol of r.volumes || VOLUMES) stamp(id, vol, null, c.review.at); }
    else if (c.review) {
      const base = out.review[id] || P.review[id] || { mechanism: 0, affinity: 0, clinical: 0, citation: 0, mastery: 0, note: '' };
      const rv = {
        mechanism: (has(c.review, 'mechanism') ? c.review.mechanism : base.mechanism) | 0,
        affinity: (has(c.review, 'affinity') ? c.review.affinity : base.affinity) | 0,
        clinical: (has(c.review, 'clinical') ? c.review.clinical : base.clinical) | 0,
        citation: base.citation | 0,
        mastery: base.mastery | 0,
        note: has(c.review, 'note') ? (c.review.note || '') : (base.note || ''),
      };
      if (!rv.mechanism && !rv.affinity && !rv.clinical && !rv.citation && !rv.mastery && !rv.note) delete out.review[id]; else out.review[id] = rv;
      for (const vol of r.volumes || VOLUMES) stamp(id, vol, null, c.review.at);
    }
  }
  // A detached source's library row goes too, once nothing else cites it (after every receptor, so the
  // order of the list does not matter). A pristine row is not the Desk's to drop: there it is a metadata delta.
  for (const key of removedKeys) {
    if (!P.sources[key] && !out.receptorSources.some(e => e.source === key) && !(out.bindingSources || []).some(e => e.source === key)) dropSource(key);
  }
  // Map key order follows the pristine seed (the database's row order), so the file is byte-identical to
  // exportState's: keys the seed does not have (a receptor's first review, say) go last, in the order made.
  const like = (obj, ref) => { const idx = new Map(Object.keys(ref || {}).map((k, i) => [k, i])); const at = k => idx.has(k) ? idx.get(k) : Infinity; return Object.fromEntries(Object.keys(obj).map((k, i) => [k, i]).sort((x, y) => (at(x[0]) - at(y[0])) || (x[1] - y[1])).map(([k]) => [k, obj[k]])); };
  // Same rule for a row list keyed by something other than its own property: a pristine row (already a rowid
  // in the seed's own database) keeps that row's place; a row the seed never had goes last, in the order made.
  const likeArr = (arr, ref, keyOf) => { const idx = new Map(Object.keys(ref || {}).map((k, i) => [k, i])); const at = k => idx.has(k) ? idx.get(k) : Infinity; return arr.map((v, i) => [v, i]).sort((x, y) => (at(keyOf(x[0])) - at(keyOf(y[0]))) || (x[1] - y[1])).map(([v]) => v); };
  return { format: FORMAT, review: like(out.review, P.review), activity: out.activity, bindingReview: out.bindingReview || [],
    sources: likeArr(out.sources, P.sources, s => s.key), receptorSources: likeArr(out.receptorSources, P.receptorSources, e => `${e.receptor_id}|${e.source}`), bindingSources: out.bindingSources || [],
    content: { claims: like(out.content.claims, P.claims), archive: like(out.content.archive, P.archive), clinical: like(out.content.clinical, P.clinical), bindings: out.content.bindings || [] } };
}

const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
/** One line for the publish prompt. Counts unpublished records only. */
function summarise(changesList) {
  let edits = 0, reverted = 0, attached = 0, detached = 0, conflicts = 0, reviews = 0;
  for (const c of changesList) {
    edits += Object.values(c.fields).filter(f => !f.publishedAs && !f.cleared).length;
    reverted += Object.values(c.fields).filter(f => !f.publishedAs && f.cleared).length;
    attached += c.sources.add.filter(a => !a.publishedAs).length;
    detached += (c.sources.remove || []).filter(x => !x.publishedAs).length;
    conflicts += Object.values(c.sources.set).filter(s => !s.publishedAs && s.conflicting).length + c.sources.add.filter(a => !a.publishedAs && a.conflicting).length;
    if (c.review && !c.review.publishedAs) reviews++;
  }
  const parts = [];
  if (edits) parts.push(plural(edits, 'content edit'));
  if (reverted) parts.push(plural(reverted, 'field') + ' reverted');
  if (attached) parts.push(plural(attached, 'source') + ' attached');
  if (detached) parts.push(plural(detached, 'source') + ' detached');
  if (conflicts) parts.push(plural(conflicts, 'conflict') + ' noted');
  if (reviews) parts.push(plural(reviews, 'review') + ' updated');
  return parts.join(', ') || 'nothing to publish';
}

// ---------- publishing: the check desk:pull makes, and the words its commit uses ----------
const STATE_KEYS = ['review', 'activity', 'bindingReview', 'sources', 'receptorSources', 'bindingSources', 'content'];
// Compared as data, not bytes: object keys sorted and every array taken as a set of rows. The edits file's
// arrays are row lists (activity, sources, edges, bindings) whose order is only the order rows were written in.
const setwise = v => Array.isArray(v) ? '[' + v.map(setwise).sort().join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + setwise(v[k])).join(',') + '}'
  : JSON.stringify(v === undefined ? null : v);
/** The top-level keys of the edits file on which two states differ as data. */
function stateDiffKeys(a, b) { return STATE_KEYS.filter(k => setwise((a || {})[k]) !== setwise((b || {})[k])); }

const keysOfObj = o => Object.keys(o || {});
/** Describe the delta in the words a curator would use, so the history is readable
 *  without opening a diff. Returns [] when nothing of substance moved. */
function summariseStates(before, after) {
  const b = before || { review: {}, sources: [], receptorSources: [], bindingSources: [], content: {} };
  const bc = b.content || {}, ac = after.content || {};
  const out = [];

  const reviewed = keysOfObj(after.review).filter(id => JSON.stringify(after.review[id]) !== JSON.stringify((b.review || {})[id]));
  if (reviewed.length) out.push(`${reviewed.length} specimen${reviewed.length === 1 ? '' : 's'} reviewed`);

  const beforeSources = new Set((b.sources || []).map(s => s.key));
  const newSources = (after.sources || []).filter(s => !beforeSources.has(s.key));
  if (newSources.length) out.push(`${newSources.length} source${newSources.length === 1 ? '' : 's'} added`);

  // The dump carries only the delta from a fresh seed, so an edge appearing in it
  // for the first time does NOT mean the citation is new: it means something about
  // it stopped matching the seed. Verifying a citation the atlas already shipped
  // makes a row appear here, and calling that "attached" is a lie about what the
  // curator did. The Desk attaches at status 'provided', so that is the tell.
  const edgeKey = e => `${e.receptor_id}|${e.source}`;
  const beforeEdges = new Map((b.receptorSources || []).map(e => [edgeKey(e), e.status]));
  const fresh = (after.receptorSources || []).filter(e => !beforeEdges.has(edgeKey(e)));
  const attached = fresh.filter(e => e.status === 'provided');
  const restatused = [
    ...fresh.filter(e => e.status !== 'provided'),
    ...(after.receptorSources || []).filter(e => beforeEdges.has(edgeKey(e)) && beforeEdges.get(edgeKey(e)) !== e.status),
  ];
  if (attached.length) out.push(`${attached.length} citation${attached.length === 1 ? '' : 's'} attached`);
  if (restatused.length) {
    const verified = restatused.filter(e => e.status === 'verified').length;
    out.push(verified === restatused.length
      ? `${verified} citation${verified === 1 ? '' : 's'} verified`
      : `${restatused.length} citation status${restatused.length === 1 ? '' : 'es'} changed`);
  }

  const bindKey = e => `${e.agent_name}|${e.target_alias}|${e.source}`;
  const beforeBinds = new Map((b.bindingSources || []).map(e => [bindKey(e), e.status]));
  const bindMoved = (after.bindingSources || []).filter(e => beforeBinds.get(bindKey(e)) !== e.status);
  if (bindMoved.length) out.push(`${bindMoved.length} binding citation${bindMoved.length === 1 ? '' : 's'} settled`);

  const contentMoved = [
    ...keysOfObj(ac.claims).filter(k => (ac.claims || {})[k] !== (bc.claims || {})[k]).map(() => 'claim'),
    ...keysOfObj(ac.archive).filter(k => JSON.stringify((ac.archive || {})[k]) !== JSON.stringify((bc.archive || {})[k])).map(() => 'narrative'),
    ...keysOfObj(ac.clinical).filter(k => JSON.stringify((ac.clinical || {})[k]) !== JSON.stringify((bc.clinical || {})[k])).map(() => 'clinical row'),
  ];
  const bindingEdits = (ac.bindings || []).filter(x =>
    !(bc.bindings || []).some(y => y.agent_name === x.agent_name && y.target_alias === x.target_alias && JSON.stringify(y) === JSON.stringify(x)));
  if (contentMoved.length) {
    const kinds = [...new Set(contentMoved)];
    out.push(`${contentMoved.length} ${kinds.length === 1 ? kinds[0] : 'content'} edit${contentMoved.length === 1 ? '' : 's'}`);
  }
  if (bindingEdits.length) out.push(`${bindingEdits.length} affinity value${bindingEdits.length === 1 ? '' : 's'} edited`);

  // Undoing work makes rows LEAVE the dump, because the dump holds only the delta
  // from a fresh seed and undoing puts you back on the seed. Everything above reads
  // what is present, so a session spent reverting summarised to nothing at all and
  // committed as "review session". A revert is a decision worth recording.
  const gone =
    keysOfObj(b.review).filter(id => !(after.review || {})[id]).length
    + (b.sources || []).filter(s => !(after.sources || []).some(x => x.key === s.key)).length
    + (b.receptorSources || []).filter(e => !(after.receptorSources || []).some(x => edgeKey(x) === edgeKey(e))).length
    + (b.bindingSources || []).filter(e => !(after.bindingSources || []).some(x => bindKey(x) === bindKey(e))).length
    + keysOfObj(bc.claims).filter(k => !(ac.claims || {})[k]).length
    + keysOfObj(bc.archive).filter(k => !(ac.archive || {})[k]).length
    + keysOfObj(bc.clinical).filter(k => !(ac.clinical || {})[k]).length
    + (bc.bindings || []).filter(x => !(ac.bindings || []).some(y => y.agent_name === x.agent_name && y.target_alias === x.target_alias)).length;
  if (gone) out.push(`${gone} change${gone === 1 ? '' : 's'} returned to what the atlas ships`);

  // Said last and only when it is the whole story, because a timestamp moving is
  // real but is not what a session was about. Without it an activity-only publish
  // fell through to "curate: review session", which tells a future reader nothing.
  if (!out.length && JSON.stringify(b.activity || []) !== JSON.stringify(after.activity || [])) {
    out.push('review timestamps updated');
  }

  return out;
}

/** `curate: ` + the lines; a count when that would not fit a 72-character subject; the old Desk's fallback when there are none. */
function commitSubject(lines) {
  if (!lines.length) return 'curate: review session';
  const subject = `curate: ${lines.join(', ')}`;
  return subject.length <= 72 ? subject : `curate: ${lines.length} changes this session`;
}

/** What a publish from the page needs: the repo's edits file must be the snapshot's (seed.baseState) or what
 *  this Desk already published (its published records alone, converted); anything else moved by another route.
 *  On ok: the new state, its file text (desk:pull's formatting) and the commit subject. */
function preparePublish(seed, changes, repoState) {
  const fromSeed = stateDiffKeys(seed.baseState, repoState);
  if (fromSeed.length) {
    // (a document can hold no published record yet still carry a published state, as a record's predecessor)
    const published = changes.map(publishedOnly);
    const anyPublished = published.some(c => countPublished([c]) > 0);
    const fromPublished = anyPublished ? stateDiffKeys(toCuratorState(seed, published), repoState) : fromSeed;
    if (fromPublished.length) return { ok: false, reason: 'seed moved', diff: fromPublished };
  }
  const state = toCuratorState(seed, changes);
  const lines = summariseStates(repoState, state);
  return { ok: true, state, text: JSON.stringify(state, null, 1) + '\n', subject: commitSubject(lines) };
}

/** Every record in one changes object (fields, tombstones, adds, removes, flags, review), for counting and marking. */
function records(c) {
  return [...Object.values(c.fields), ...c.sources.add, ...(c.sources.remove || []), ...Object.values(c.sources.set), ...(c.review ? [c.review] : [])];
}

function countUnpublished(changesList) {
  let n = 0;
  for (const c of changesList) n += records(c).filter(r => !r.publishedAs).length;
  return n;
}

/** The mirror of countUnpublished: records already carried by a published edits file. */
function countPublished(changesList) {
  let n = 0;
  for (const c of changesList) n += records(c).filter(r => r.publishedAs).length;
  return n;
}

function markPublished(changes, sha) {
  const c = clone(changes);
  // a record marked published is now the published state: its predecessor goes
  const mark = r => { r.publishedAs = sha; delete r.published; };
  for (const f of Object.values(c.fields)) if (!f.publishedAs) mark(f);
  for (const a of c.sources.add) if (!a.publishedAs) mark(a);
  for (const x of c.sources.remove || []) if (!x.publishedAs) mark(x);
  for (const s of Object.values(c.sources.set)) if (!s.publishedAs) mark(s);
  if (c.review && !c.review.publishedAs) mark(c.review);
  return c;
}

/** JSON with object keys sorted, so two records compare equal whatever order a store gave their keys. */
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'
  : JSON.stringify(v === undefined ? null : v);
const sameRecord = (a, b) => { if (!a || !b) return false; const { publishedAs: _a, published: _c, ...x } = a, { publishedAs: _b, published: _d, ...y } = b; return stable(x) === stable(y); };

/** markPublished for a store that may have moved since the pull. `pulled` is the document as it was
 *  converted and committed, so each of its records is now what the repo holds. Per record of `current`:
 *  - deep-equal (publishedAs and predecessor aside) to its pulled counterpart: marked published with sha;
 *  - changed since the pull: stays unpublished, with the pulled record as its predecessor
 *    (`published = { ...pulled, publishedAs: sha }`);
 *  - pulled but gone from `current` (deleted before marking): re-created as the published form of "back to
 *    the seed" — a tombstone for a field, flag set or review, a sources.remove for an add — carrying the
 *    pulled record, so publishedOnly still reproduces the repo; stamped `at` (the marking time). */
function markPublishedFrom(current, pulled, sha, at = new Date().toISOString()) {
  const c = clone(current);
  if (!pulled) return c;
  const p = clone(pulled), ps = p.sources || {};
  c.sources.remove = c.sources.remove || [];
  const mark = r => { r.publishedAs = sha; delete r.published; };   // it is now the published state
  const asPublished = r => { const { published: _p, ...own } = r; return { ...own, publishedAs: sha }; };
  const settle = (cur, pr) => {       // cur and pr both present
    if (cur.publishedAs) return;
    if (sameRecord(cur, pr)) mark(cur); else cur.published = asPublished(pr);
  };
  // a re-created revert is stamped with the marking time: it is newer than any copy of the pulled record
  // another view may still hold, so it wins mergeChanges' later-`at` rule
  const tombstone = pr => pr.cleared ? asPublished(pr) : { cleared: true, at, publishedAs: null, published: asPublished(pr) };
  // fields
  for (const [k, pr] of Object.entries(p.fields || {})) { if (c.fields[k]) settle(c.fields[k], pr); else c.fields[k] = tombstone(pr); }
  // a source's add or remove, one record per key
  const pulledEdges = [...(ps.add || []), ...(ps.remove || [])];
  for (const pr of pulledEdges) {
    const cur = c.sources.add.find(x => x.key === pr.key) || c.sources.remove.find(x => x.key === pr.key);
    if (cur) { settle(cur, pr); continue; }
    if ('is_primary' in pr) {            // an add, since deleted: a remove carrying it (and its library row)
      c.sources.remove.push({ key: pr.key, at, publishedAs: null, published: asPublished(pr) });
      if (p.library && p.library[pr.key] && !c.library[pr.key]) c.library[pr.key] = p.library[pr.key];
    } else c.sources.remove.push(asPublished(pr));
  }
  // flag sets
  for (const [k, pr] of Object.entries(ps.set || {})) { if (c.sources.set[k]) settle(c.sources.set[k], pr); else c.sources.set[k] = tombstone(pr); }
  // review
  if (p.review) { if (c.review) settle(c.review, p.review); else c.review = tombstone(p.review); }
  return c;
}

/** Only what a publish has already carried: per record, the record itself when published, else its
 *  `published` predecessor, else nothing (and the library rows of the adds that result). desk:pull converts
 *  this to recognise "the repo's edits file is what this Desk published". A source's add and remove are one
 *  record: whichever shape the published state has (an add carries is_primary) is where it goes. */
function publishedOnly(changes) {
  const c = clone(changes);
  const out = emptyChanges(c.receptorId, c.seedCommit);
  const eff = r => !r ? null : r.publishedAs ? r : r.published || null;
  for (const [k, f] of Object.entries(c.fields || {})) { const e = eff(f); if (e) out.fields[k] = e; }
  const src = c.sources || {};
  for (const r of [...(src.add || []), ...(src.remove || [])]) {
    const e = eff(r); if (!e) continue;
    if ('is_primary' in e) out.sources.add.push({ ...e, key: r.key }); else out.sources.remove.push({ ...e, key: r.key });
  }
  for (const [k, s] of Object.entries(src.set || {})) { const e = eff(s); if (e) out.sources.set[k] = e; }
  for (const a of out.sources.add) if (c.library && c.library[a.key]) out.library[a.key] = c.library[a.key];
  out.review = eff(c.review);
  return out;
}

/** Two copies of one receptor's changes (this view's, and another view's from the store) as one. Per record
 *  (a field, a source add or remove, a flag set, the review) the one with the later `at` wins, ties to remote,
 *  and it keeps its own publishedAs; an add and a remove of the same source compete as one record. Spans
 *  are unioned by (field, start, sourceKey), remote's copy first; the library is unioned. */
function mergeChanges(local, remote) {
  if (!local) return clone(remote);
  if (!remote) return clone(local);
  const L = clone(local), R = clone(remote);
  // The winner keeps its own predecessor. An unpublished winner with none takes the loser's published state
  // (the loser itself when published, else its predecessor): that is the same published state, which the
  // winner overwrote without having seen it.
  const pick = (l, r) => !l ? r : !r ? l : String(l.at || '') > String(r.at || '') ? l : r;
  // When both carry a published state, the later one (by that published record's own `at`) is kept.
  const later = (l, r) => {
    const w = pick(l, r); if (!w || !l || !r) return w;
    if (!w.publishedAs) {
      const p = predecessorOf(w === l ? r : l);
      if (p && (!w.published || String(p.at || '') > String(w.published.at || ''))) w.published = p;
    }
    return w;
  };
  const out = emptyChanges(R.receptorId ?? L.receptorId, R.seedCommit ?? L.seedCommit);
  const keysOf = (a, b) => [...new Set([...Object.keys(b || {}), ...Object.keys(a || {})])];
  for (const k of keysOf(L.fields, R.fields)) out.fields[k] = later((L.fields || {})[k], (R.fields || {})[k]);
  const edges = c => { const m = {}; const src = c.sources || {}; for (const a of src.add || []) m[a.key] = { kind: 'add', rec: a }; for (const x of src.remove || []) m[x.key] = { kind: 'remove', rec: x }; return m; };
  const le = edges(L), re = edges(R);
  for (const k of keysOf(le, re)) {
    const l = le[k], r = re[k];
    const w = !l ? r : !r ? l : pick(l.rec, r.rec) === l.rec ? l : r;
    if (l && r) later(l.rec, r.rec);   // only for the predecessor hand-over onto the winning record
    out.sources[w.kind].push(w.rec);
  }
  const ls = (L.sources || {}).set || {}, rs = (R.sources || {}).set || {};
  for (const k of keysOf(ls, rs)) out.sources.set[k] = later(ls[k], rs[k]);
  out.library = { ...(L.library || {}), ...(R.library || {}) };
  const spanKey = sp => `${sp.field}|${sp.start}|${sp.sourceKey}`;
  const seen = new Set((R.spans || []).map(spanKey));
  out.spans = [...(R.spans || []), ...(L.spans || []).filter(sp => !seen.has(spanKey(sp)))];
  out.review = L.review || R.review ? later(L.review, R.review) : null;
  return out;
}

/** After a re-seed: published records are now in the seed, so drop them; keep the rest against the new commit. */
function rekey(changes, newSeed) {
  const c = clone(changes); c.seedCommit = newSeed.commit;
  for (const [k, f] of Object.entries(c.fields)) if (f.publishedAs) delete c.fields[k];
  c.sources.add = c.sources.add.filter(a => !a.publishedAs);
  c.sources.remove = (c.sources.remove || []).filter(x => !x.publishedAs);
  // what survives is unpublished; the published state behind it is in the new seed now
  for (const r of [...Object.values(c.fields), ...c.sources.add, ...c.sources.remove, ...Object.values(c.sources.set)]) delete r.published;
  if (c.review) delete c.review.published;
  for (const [k, s] of Object.entries(c.sources.set)) if (s.publishedAs) delete c.sources.set[k];
  for (const k of Object.keys(c.library)) if (!c.sources.add.some(a => a.key === k)) delete c.library[k];
  if (c.review && c.review.publishedAs) c.review = null;
  return c;
}

/** What is wrong with one change document (as a store or a file holds it), or null. */
function changeShapeError(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'is not a change document (an object)';
  if (typeof d.receptorId !== 'string') return 'has no receptorId';
  if (!d.fields || typeof d.fields !== 'object') return 'has no fields object';
  if (!d.sources || typeof d.sources !== 'object' || !Array.isArray(d.sources.add) || !d.sources.set || typeof d.sources.set !== 'object') return 'has no sources { add: [], set: {} }';
  return null;
}

/** Every distinct publishedAs in the documents, in first-seen order. */
function publishedShas(changes) {
  const shas = new Set();
  for (const c of changes) {
    const src = c.sources || {};
    for (const r of [...Object.values(c.fields || {}), ...(src.add || []), ...(src.remove || []), ...Object.values(src.set || {}), ...(c.review ? [c.review] : [])]) {
      if (r && r.publishedAs) shas.add(r.publishedAs);
      if (r && r.published && r.published.publishedAs) shas.add(r.published.publishedAs);   // rekey drops these too
    }
  }
  return [...shas];
}

/** Unpublished reverts (tombstones) and detaches (removes), per receptor. They mean "take the published
 *  state back out"; once rekey folds that published state into the seed, a tombstone would be read as
 *  "back to the NEW seed" and silently keep what it was meant to remove. */
function unpublishedReverts(changes) {
  const out = [];
  for (const c of changes) {
    const src = c.sources || {};
    const n = [...Object.values(c.fields || {}), ...Object.values(src.set || {}), ...(c.review ? [c.review] : [])].filter(r => r && r.cleared && !r.publishedAs).length
      + (src.remove || []).filter(r => !r.publishedAs).length;
    if (n) out.push({ receptorId: c.receptorId, n });
  }
  return out;
}

/** isAncestor(sha) → boolean is the git seam. */
function rekeyAll(seed, changes, isAncestor) {
  const reverts = unpublishedReverts(changes);
  if (reverts.length) {
    const n = reverts.reduce((a, r) => a + r.n, 0);
    return { ok: false, reason: 'unpublished reverts', n, receptors: reverts.map(r => r.receptorId),
      message: `publish or discard ${n} unpublished reverts/detaches before re-seeding: ${reverts.map(r => r.receptorId).join(', ')}` };
  }
  const missing = publishedShas(changes).filter(sha => !isAncestor(sha));
  if (missing.length) return { ok: false, reason: 'not in history', missing,
    message: `published as ${missing.join(', ')}, which ${missing.length === 1 ? 'is' : 'are'} not in the history of HEAD, so the new seed (${seed.commit}) may not carry ${missing.length === 1 ? 'it' : 'them'}. Pull, re-seed, and run this again.` };
  return { ok: true, docs: changes.map(c => rekey(c, seed)) };
}

    "abstract": "Concentrated in the limbic striatum, D3 modulates motivation and the drive to pursue reward. Reduced activity is associated with anhedonia and amotivation, in which goals lose urgency and reward loses salience. Excessive agonism disrupts impulse control, producing compulsive behaviour patterns including pathological gambling and hypersexuality.",

    "body": [
     "When D3 activity is within its normal range, it supports goal-directed behaviour and reward anticipation. Reduced activity impairs motivational drive; clinically this presents as anhedonia and the negative symptoms of amotivation and blunted affect. Excessive D3 signalling, conversely, impairs behavioural inhibition, contributing to the impulse control disorders seen particularly with D2/D3 agonism in Parkinson's disease. Its predominantly limbic distribution means D3 can in principle be targeted for motivational symptoms with a lower risk of the extrapyramidal effects associated with nigrostriatal D2 antagonism."

    "abstract": "DAT clears dopamine from the synapse, determining the kinetics of dopaminergic signalling. A slow, gradual rise in dopamine sustains attention and supports goal-directed action; a rapid, large surge activates the reward circuit powerfully and stamps in reinforcement. DAT is concentrated in the striatum, the core circuit of learned association and craving.",

    "effect": "Reuptake: terminates dopaminergic signalling",
    "receptor_class": "Sodium-coupled transporter (SLC6A3)",
    "ligand": "Dopamine, cleared from the synapse",
    "figure_caption": "Fig. 9 · A dopamine reuptake pump",
    "body": [
     "The rate of dopamine rise and its duration determine whether a signal functions as reinforcement or as sustained tone. An abrupt, large surge activates the mesolimbic reward circuit intensely: the synapse encodes that this context is predictive of reward, and the experience is accompanied by craving and compulsive seeking. A slow, measured increase in dopamine (as with extended-release formulations) occupies the same receptors without producing that discrete reinforcement signal, supporting attention and goal pursuit without driving compulsive behaviour. The prefrontal cortex expresses relatively little DAT, so blockade there has limited effect on dopamine clearance; the striatum is where transporter occupancy most directly shapes reinforcement and craving."

    "abstract": "A ligand-gated cation channel on vagal afferents and the area postrema, 5-HT3 activation triggers nausea, retching, and vomiting. It is serotonin's only ionotropic receptor and a clinically relevant target at the intersection of gut-brain signalling, mood, and gastrointestinal distress.",

     "5-HT3 is serotonin's only fast ionotropic receptor, a pentameric cation channel structurally related to nicotinic and GABA-A receptors. It is expressed on vagal afferents and in the area postrema, the brainstem's chemoreceptor trigger zone, where serotonin release activates it to produce nausea, retching, and vomiting. Antagonism blocks this signal and is the basis of 5-HT3 receptor antiemetics. Its role in cortical circuits is less well characterised, but it may modulate mood and cognition through interoceptive pathways."

    "body": [
     "SERT clears serotonin from the synapse, determining the half-life of each serotonergic signal. By mediating reuptake of 5-HT (serotonin) into presynaptic neurons, SERT regulates serotinergic signaling throughout the brain. Due to interactions with other key cerebral molecules and its contribution to neurotransmission, SERT plays an integral role in the pathophysiology of depression. Activity and expression of SERT is regulated by pro-inflammatory cytokines and growth factors which then affects serotonin transmission and neural plasticity. Other influencers of SERT function include environmental exposure, diet, gut microbiota, and therapy. Genetic variations in the SLC6A4 gene influence the expression and function of SERT which leads to differences in depression symptoms as well as treatment response."

    "body": [
     "M1 receptors in the prefrontal cortex and hippocampus support working memory, attention, and executive function through Gq-coupled phospholipase C signalling. Blockade, whether from tricyclic antidepressants, first-generation antipsychotics, or antihistamines, produces the anticholinergic syndrome: peripherally, dry mouth, constipation, urinary retention, and dilated pupils; centrally, mental fog, memory lapses, and, at higher load in vulnerable individuals, frank delirium. Cumulative anticholinergic burden over years is associated with accelerated cognitive decline. Selective M1 agonism, conversely, improves memory and attention, and may reduce psychotic symptoms through a mechanism independent of dopamine blockade; this is the rationale for xanomeline-trospium as a novel antipsychotic approach."

    "abstract": "The fast acetylcholine channel that drives reinforcement and shapes attention. The α4β2 subtype carries the reward signal on dopamine neurons, making this receptor the substrate of dependence and craving. The α7 subtype supports sensory filtering: the suppression of irrelevant, repetitive stimuli to allow focused attention.",
    "presentation": "Healthy α4β2 tone underlies the capacity for reinforced learning and reward; its engagement produces a strong pull toward repetition, and its loss brings withdrawal: irritability, anxiety, and craving. α7 dysfunction weakens sensory gating, leaving the brain flooded with irrelevant stimuli and the person unable to filter noise.",

    "ligand": "Acetylcholine (and nicotine)",
    "figure_caption": "Fig. 19 · A nicotine-gated cation pentamer",
    "body": [
     "α4β2 nicotinic receptors on mesolimbic dopamine neurons carry the reinforcing signal underlying reward learning. Chronic activation by nicotine produces upregulation of these receptors; in their absence, withdrawal emerges as irritability, dysphoria, and craving, reflecting the degree to which tonic nicotinic stimulation had been integrated into the reward circuit's baseline. The α7 subtype, expressed on prefrontal and hippocampal neurons, supports sensory gating: the suppression of redundant or irrelevant stimuli that allows attention to focus. Reduced α7 function impairs this filtering and is associated with the cognitive symptoms and P50 gating deficits seen in schizophrenia. Partial agonism at α4β2 (varenicline) reduces craving and blunts the reward response to smoking without producing the full reinforcing effect."

    "abstract": "The primary opioid receptor mediating analgesia, euphoria, and reward. Activation reduces pain signalling, produces sedation and emotional well-being, and engages the mesolimbic reward circuit. Repeated activation leads to tolerance and physical dependence; withdrawal produces dysphoria, autonomic hyperactivity, and craving. At supratherapeutic doses, respiratory depression is the critical risk.",
    "presentation": "μ-opioid engagement brings pain relief, warmth, emotional soothing, and pleasure; at higher doses, drowsiness, pinpoint pupils, and slowed breathing. Chronic engagement breeds tolerance and craving; withdrawal brings dysphoria, body aches, and sweating. Blunted baseline tone underlies some forms of anhedonia.",
    "effect": "Inhibitory: analgesia, euphoria, dependence",
    "receptor_class": "Gi/o-coupled GPCR (opioid)",
    "ligand": "β-endorphin, enkephalins",
    "figure_caption": "Fig. 21 · A Gi opioid receptor",
    "body": [
     "Endogenous opioid peptides (endorphins and enkephalins) act at μ receptors distributed throughout the central and peripheral nervous system to modulate pain, reward, and autonomic function. Activation produces analgesia, sedation, and well-being, through both direct inhibitory effects in pain pathways and disinhibition of mesolimbic dopamine neurons, where μ receptors silence GABAergic interneurons in the ventral tegmental area to release dopamine in the nucleus accumbens. At higher doses, μ-opioid agonism suppresses respiratory drive in the brainstem, making respiratory depression the primary risk of overdose. Repeated activation triggers receptor desensitization and downregulation: larger doses are required for equivalent analgesia (tolerance), and in the absence of expected agonism, withdrawal emerges, characterized by dysphoria, autonomic hyperactivity, and craving. Endogenous μ-opioid tone also contributes to baseline hedonic capacity; reduced signalling has been proposed as a mechanism in certain presentations of anhedonia, and partial agonism strategies are under investigation as adjunctive treatments in refractory depression."
    ],

   "archive": {
    "abstract": "The receptors that translate darkness into sleep and synchronize the body to the day-night cycle. MT1 primarily eases sleep onset and MT2 primarily shifts the circadian clock, though both are co-expressed in the suprachiasmatic nucleus and contribute to each. Together they read the melatonin signal from the pineal gland and tell the brain when night has arrived.",
    "presentation": "MT1 and MT2 signalling communicates darkness to the suprachiasmatic nucleus, triggering the shift toward sleep onset and aligning the internal clock to the external day-night cycle. MT1 activation promotes sleep onset; MT2 activation shifts circadian phase. The result is phase-aligned sleep rather than generalised sedation.",
    "effect": "Inhibitory: sets circadian phase and sleep onset",
    "receptor_class": "Gi/o-coupled GPCRs (MT1 / MT2)",
    "ligand": "Melatonin",
    "figure_caption": "Fig. 22 · Gi coupling, the circadian clock",
    "body": [
     "Melatonin, released from the pineal gland in darkness, circulates to the suprachiasmatic nucleus and binds MT1 and MT2 receptors in the brain's master circadian pacemaker. MT1 activation promotes sleep onset by reducing neuronal firing in wake-promoting circuits; MT2 activation advances or delays circadian phase, adjusting the clock to match the external light-dark cycle. Because the signal acts through endogenous circadian mechanisms rather than generalised sedation, it does not produce the tolerance, dependence, or residual impairment associated with benzodiazepines or z-drugs. Ramelteon (MT1/MT2 agonist) and tasimelteon (for non-24-hour sleep-wake disorder in blind individuals) exploit this mechanism clinically."

    "abstract": "The newest sleep target, approached by withdrawing the signal that maintains wakefulness. Orexin neurons stabilize the brain in a continuous awake state; their loss is narcolepsy. Blocking OX1/OX2 reduces wake drive rather than producing generalised sedation, allowing sleep to emerge through normal mechanisms.",
    "presentation": "Healthy orexin tone sustains daytime wakefulness and a stable wake-sleep boundary; its loss is narcolepsy: daytime sleep attacks, fragmented night sleep, and emotion-triggered cataplexy. Blocking the signal reduces wake drive without producing generalised sedation.",
    "effect": "Excitatory: stabilizes wakefulness",

    "ligand": "Orexin-A / orexin-B (hypocretin)",
    "figure_caption": "Fig. 23 · Gq coupling, the wake switch",
    "body": [
     "Orexin neurons in the lateral hypothalamus fire continuously throughout wakefulness, stabilizing arousal and maintaining a sharp wake-sleep boundary through excitatory projections to the locus coeruleus, raphe, and tuberomammillary nucleus. Their loss is narcolepsy with cataplexy: the inability to sustain wakefulness, with sudden loss of muscle tone triggered by strong emotion, reflecting orexin's role in suppressing REM motor atonia during waking hours. Dual orexin receptor antagonists (suvorexant, lemborexant) block both OX1 and OX2, reducing wake drive and facilitating sleep onset without the generalised CNS depression of benzodiazepines or z-drugs. The result is sleep with largely preserved architecture and lower rebound insomnia risk. Orexin replacement strategies, including OX2-selective agonists and intranasal orexin, are under investigation as approaches to narcolepsy that restore the missing arousal signal rather than compensating for it."

    "body_json": "[\"When active, 5-HT2C exerts a tonic brake on mesolimbic dopamine release and signals satiation to the hypothalamus, providing a dual check on hunger and appetitive drive. When this restraint is reduced, appetite increases and reward-seeking becomes less inhibited, contributing to the weight gain associated with medications that block 5-HT2C. Its influence on mood is less direct, mediated through the same appetite and interoceptive circuits.\"]",

   "ht3": {

   "sert": {

    "body_json": "[\"SERT clears serotonin from the synapse, determining the half-life of each serotonergic signal. High transporter activity means each serotonin release is brief and quickly terminated, maintaining a lower overall tone; blockade prolongs each signal, gradually raising serotonergic tone across all circuits as postsynaptic receptors adjust to the new baseline. This adaptive process accounts for the delay of weeks before clinical effects emerge. Variation in the promoter region (5-HTTLPR) has been studied as a moderator of stress sensitivity with mixed results; nevertheless, individual differences in transporter expression and activity contribute to variability in mood and antidepressant treatment response.\"]",

   "d1": {
    "abstract": "The primary dopamine receptor in the prefrontal cortex, where it supports working memory and cognitive clarity. D1 activity follows an inverted-U relationship with performance: insufficient tone impairs sustained firing in task-relevant circuits, while excess dopamine produces disordered, noisy activity. Both extremes can manifest as the cognitive and negative dimensions of thought disorder.",
    "presentation": "At optimal tone: crisp working memory, sustained focus, and orderly cognition. Off the peak: distractibility, disorganization, racing or stalled thought, and the blunting and poverty of thought that underlie the cognitive dimension of psychosis.",
    "effect": "Excitatory: raises cAMP (prefrontal cognition)",
    "receptor_class": "Gs-coupled GPCR (excitatory)",
    "ligand": "Dopamine",
    "figure_caption": "Fig. 6 · Gs coupling, prefrontal cortex",
    "body_json": "[\"D1 is the dominant dopamine receptor in the prefrontal cortex, where it filters noise and sustains signal in task-relevant circuits. The relationship between D1 stimulation and cognitive performance is non-linear: insufficient dopamine impairs the persistent firing that working memory requires, while excess dopamine drives haphazard, disorganised activity. In schizophrenia, the negative and cognitive symptoms (flat affect, alogia, avolition, poor working memory) are linked to insufficient prefrontal D1 tone; disorganised thought and positive symptoms track more closely with NMDA hypofunction and mesolimbic dopamine excess than with the prefrontal D1 curve itself.\"]",

   "d2": {
    "abstract": "D2 receptors are distributed across limbic, motor, and neuroendocrine circuits with distinct effects at each site. In the limbic striatum, elevated D2 tone amplifies salience, making neutral stimuli feel charged and ominous; on the aberrant salience model, this is the basis of delusion and paranoia. In the motor striatum, D2 activity supports smooth movement; insufficient tone produces rigidity and tremor. In the pituitary, D2 suppresses prolactin release; blockade raises prolactin levels.",
    "presentation": "High limbic tone: suspiciousness, ideas of reference, delusion, and the sense that events carry hidden meaning. Low motor tone: stiffness, slowed movement, tremor, inner restlessness, and the subjective stall of akinesia. Prolactin rise produces galactorrhea and sexual side effects.",
    "effect": "Inhibitory: lowers cAMP",
    "receptor_class": "Gi/o-coupled GPCR (inhibitory)",
    "ligand": "Dopamine",
    "figure_caption": "Fig. 7 · Gi coupling, striatal dopamine",
    "body_json": "[\"D2 receptors are expressed across mesolimbic, nigrostriatal, and tuberoinfundibular pathways. In the limbic striatum, elevated D2 activity increases the perceived salience of incoming stimuli: at excessive levels, neutral events acquire unwarranted significance, generating the ideas of reference and suspicion that characterise psychosis. In the motor striatum, adequate D2 activity is necessary for fluid, purposeful movement; depletion produces rigidity and bradykinesia. The tuberoinfundibular pathway descending from the hypothalamus normally suppresses prolactin secretion at the pituitary; D2 antagonism removes this inhibition, causing hyperprolactinaemia with galactorrhoea and sexual dysfunction.\"]",
    "tags_json": "[\"Aberrant salience\",\"Motor fluidity\",\"Limbic and nigrostriatal\"]"
   },
   "d3": {
    "abstract": "Concentrated in the limbic striatum, D3 modulates motivation and the drive to pursue reward. Reduced activity is associated with anhedonia and amotivation, in which goals lose urgency and reward loses salience. Excessive agonism disrupts impulse control, producing compulsive behaviour patterns including pathological gambling and hypersexuality.",
    "presentation": "Underfunction: anhedonia (nothing feels rewarding or worth the effort), amotivation, and flat drive; things that should feel compelling instead feel empty. Overfunction: heightened wanting, compulsive pursuit, and impulse dyscontrol, producing the compulsive patterns seen in gambling, hypersexuality, and binge eating.",
    "effect": "Inhibitory: limbic reward and motivation",
    "receptor_class": "Gi/o-coupled GPCR (limbic, D2-like)",
    "ligand": "Dopamine",
    "figure_caption": "Fig. 8 · A limbic, D2-like receptor",
    "body_json": "[\"When D3 activity is within its normal range, it supports goal-directed behaviour and reward anticipation. Reduced activity impairs motivational drive; clinically this presents as anhedonia and the negative symptoms of amotivation and blunted affect. Excessive D3 signalling, conversely, impairs behavioural inhibition, contributing to the impulse control disorders seen particularly with D2/D3 agonism in Parkinson's disease. Its predominantly limbic distribution means D3 can in principle be targeted for motivational symptoms with a lower risk of the extrapyramidal effects associated with nigrostriatal D2 antagonism.\"]",
    "tags_json": "[\"Motivation and drive\",\"Reward anticipation\",\"Impulse regulation\"]"
   },
   "dat": {
    "abstract": "DAT clears dopamine from the synapse, determining the kinetics of dopaminergic signalling. A slow, gradual rise in dopamine sustains attention and supports goal-directed action; a rapid, large surge activates the reward circuit powerfully and stamps in reinforcement. DAT is concentrated in the striatum, the core circuit of learned association and craving.",
    "presentation": "Rapid surges: euphoria, craving, and compulsive seeking. Gradual occupancy: sustained focus, improved attention, and the measured pace of goal-pursuit without the spike of reinforcement that drives addiction.",
    "effect": "Reuptake: terminates dopaminergic signalling",
    "receptor_class": "Sodium-coupled transporter (SLC6A3)",
    "ligand": "Dopamine, cleared from the synapse",
    "figure_caption": "Fig. 9 · A dopamine reuptake pump",
    "body_json": "[\"The rate of dopamine rise and its duration determine whether a signal functions as reinforcement or as sustained tone. An abrupt, large surge activates the mesolimbic reward circuit intensely: the synapse encodes that this context is predictive of reward, and the experience is accompanied by craving and compulsive seeking. A slow, measured increase in dopamine (as with extended-release formulations) occupies the same receptors without producing that discrete reinforcement signal, supporting attention and goal pursuit without driving compulsive behaviour. The prefrontal cortex expresses relatively little DAT, so blockade there has limited effect on dopamine clearance; the striatum is where transporter occupancy most directly shapes reinforcement and craving.\"]",
    "tags_json": "[\"Reinforcement timing\",\"Wanting and craving\",\"Sustained attention\"]"
   },
   "a1": {
    "abstract": "An excitatory adrenergic receptor that drives arousal and vascular tone. Centrally, high activity feeds hyperarousal, trauma nightmares, and fragmented sleep; its blockade quiets those hyperadrenergic surges. Peripherally, it tightens blood vessels; its blockade causes dizziness on standing and sedation.",
    "presentation": "Central excess: hyperarousal, fragmented sleep, trauma nightmares; peripheral loss: light-headedness on standing, drowsiness.",
    "effect": "Excitatory: vascular tone and arousal",
    "receptor_class": "Gq-coupled GPCR (adrenergic)",
    "ligand": "Norepinephrine (and epinephrine)",
    "figure_caption": "Fig. 10 · A Gq adrenergic receptor",
    "body_json": "[\"Central α1 activity sustains arousal and underlies the hypervigilance and nocturnal awakenings associated with excessive noradrenergic tone. Blockade reduces these hyperadrenergic surges, attenuating pathological startle and sleep fragmentation. Peripherally, α1 maintains vascular tone against gravitational pooling; blockade reduces this support, producing orthostatic hypotension and sedation as central arousal is dampened.\"]",
    "tags_json": "[\"Hyperarousal & nightmares\",\"Vascular tone\",\"Sympathetic drive\"]"

   "a2": {
    "abstract": "A presynaptic autoreceptor that limits norepinephrine release at the synapse and modulates prefrontal dopamine. Engaging it lowers arousal and tightens focus; releasing it raises vigilance and impulsivity. Blockade also disinhibits serotonin release, which contributes to effects on mood and energy.",
    "presentation": "Engagement: calm, steady focus, low startle, reduced heart rate and blood pressure; release: heightened alertness, impulsive drive, restlessness.",

    "receptor_class": "Gi/o-coupled GPCR (autoreceptor)",
    "ligand": "Norepinephrine",
    "figure_caption": "Fig. 11 · The noradrenergic autoreceptor",
    "body_json": "[\"As a presynaptic autoreceptor, α2 senses synaptic norepinephrine and suppresses further release, reducing whole-body sympathetic tone. Agonism produces reduced startle, lower heart rate and blood pressure, and in the prefrontal cortex, improved signal-to-noise ratio that tightens sustained focus and working memory. Antagonism does the opposite, raising noradrenergic output and disinhibiting serotonin release, which accounts for the activating and mood-elevating effects of α2 blockade.\"]",

   "b1": {
    "abstract": "The adrenergic receptor mediating the peripheral somatic signs of sympathetic activation: tachycardia, tremor, and diaphoresis. Blockade attenuates these physical manifestations of anxiety while leaving cognitive worry largely intact, producing a calmer physiological state without sedation.",

    "ligand": "Norepinephrine / epinephrine",
    "figure_caption": "Fig. 12 · Gs coupling, sympathetic signs",
    "body_json": "[\"β-adrenergic activation produces the peripheral features of acute anxiety and fear: tachycardia, tremor, and sweating. Blockade attenuates these somatic signs; heart rate steadies and tremor diminishes, though cognitive anxiety is not directly addressed by peripheral blockade. Centrally, β-adrenergic signalling participates in the consolidation of emotionally charged memories, which has made these receptors a subject of investigation in trauma reconsolidation research, though clinical translation has been difficult.\"]",
    "tags_json": "[\"Racing heart & tremor\",\"Performance anxiety\",\"Somatic anxiety\"]"

   "net": {
    "abstract": "The transporter responsible for norepinephrine clearance from the synapse, setting baseline noradrenergic tone and energy level. In the prefrontal cortex it also clears dopamine, so blockade raises prefrontal dopamine alongside norepinephrine, sharpening sustained attention. Insufficient noradrenergic tone is associated with fatigue and poor attention; excess produces restlessness.",
    "presentation": "Blockade: lifted mood and energy, sharper focus, steadier attention; underactivity: fatigue, inattention, low drive.",

    "figure_caption": "Fig. 13 · A norepinephrine reuptake pump",
    "body_json": "[\"NET activity determines noradrenergic tone by setting the rate of synaptic norepinephrine clearance. Because the prefrontal cortex expresses little dopamine transporter, NET is the principal mechanism for dopamine reuptake there; blockade therefore raises prefrontal dopamine alongside norepinephrine, improving signal-to-noise in working memory circuits. Increased noradrenergic and prefrontal dopaminergic tone improves energy, sustained attention, and executive function; insufficient tone is associated with fatigue, attentional drift, and reduced drive.\"]",
    "tags_json": "[\"Prefrontal dopamine\",\"Energy & focus\",\"Sustained attention\"]"
